<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card auth-card">
        <h1>Đăng nhập</h1>

        <div class="alert success" th:if="${param.verified}">Xác nhận tài khoản thành công.</div>
        <div class="alert success" th:if="${param.reset}">Đổi mật khẩu thành công.</div>
        <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
        <div class="alert error" th:if="${param.error}">Username/email hoặc mật khẩu không đúng.</div>

        <form th:action="@{/login}" method="post">
            <label>Username hoặc Email</label>
            <input type="text" name="login" required autofocus>

            <label>Mật khẩu</label>
            <input type="password" name="password" required>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="btn" type="submit">Đăng nhập</button>
        </form>

        <p><a th:href="@{/register}">Đăng ký tài khoản</a></p>
        <p><a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
    </div>
</main>
</body>
</html>
