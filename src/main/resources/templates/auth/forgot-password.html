<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card auth-card">
        <h1>Quên mật khẩu</h1>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <label>Email</label>
            <input type="email" th:field="*{email}" required>
            <small class="field-error" th:errors="*{email}"></small>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn" type="submit">Gửi OTP</button>
        </form>
    </div>
</main>
</body>
</html>
