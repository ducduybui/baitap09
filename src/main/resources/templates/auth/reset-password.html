<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card auth-card">
        <h1>Đặt lại mật khẩu</h1>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>OTP</label>
            <input type="text" name="otp" maxlength="6" required>

            <label>Mật khẩu mới</label>
            <input type="password" th:field="*{password}" required>

            <label>Xác nhận mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" required>
            <small class="field-error" th:errors="*{confirmPassword}"></small>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn" type="submit">Đổi mật khẩu</button>
        </form>
    </div>
</main>
</body>
</html>
