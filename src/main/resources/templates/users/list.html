<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quản lý User')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container page">
    <div class="page-header">
        <h1>Quản lý User</h1>
        <a class="btn" th:href="@{/users/create}">+ Thêm User</a>
    </div>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form class="toolbar" th:action="@{/users}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm username, email, họ tên">
        <select name="size">
            <option value="5" th:selected="${size == 5}">5</option>
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
        </select>
        <button class="btn" type="submit">Tìm kiếm</button>
        <a class="btn btn-secondary" th:href="@{/users}">Xóa lọc</a>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Role</th>
                <th>Enabled</th>
                <th>Products</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users.content}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.roleName}"></td>
                <td th:text="${u.enabled ? 'Có' : 'Không'}"></td>
                <td th:text="${u.productCount}"></td>
                <td class="actions">
                    <a class="btn btn-small" th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-small btn-danger" type="submit" onclick="return confirm('Xóa user này?')">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.totalElements == 0}">
                <td colspan="8">Không có dữ liệu.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">←</a>
        <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
           th:href="@{/users(page=${i},size=${size},keyword=${keyword})}"
           th:text="${i + 1}"
           th:classappend="${i == users.number ? 'active' : ''}"></a>
        <a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">→</a>
    </div>
</main>
</body>
</html>
