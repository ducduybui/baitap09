<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('User')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card">
        <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">User</h1>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="${mode == 'create' ? '/users/create' : '/users/edit/' + userDTO.id}"
              th:object="${userDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Username</label>
            <input type="text" th:field="*{username}" required>
            <small class="field-error" th:errors="*{username}"></small>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Họ tên</label>
            <input type="text" th:field="*{fullName}" required>

            <label>Password</label>
            <input type="password" name="password" th:placeholder="${mode == 'create' ? 'Mặc định 123456 nếu bỏ trống' : 'Để trống nếu không đổi'}">

            <label>Role</label>
            <select name="roleId" required>
                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.name}"
                        th:selected="${userDTO.roleId != null and userDTO.roleId == role.id}"></option>
            </select>

            <label class="checkbox">
                <input type="checkbox" th:field="*{enabled}"> Kích hoạt
            </label>

            <button class="btn" type="submit">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/users}">Hủy</a>
        </form>
    </div>
</main>
</body>
</html>
