<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

<form th:action="@{/logout}" method="post">
    <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}">
    <button type="submit">
        Đăng xuất
    </button>
</form>

<header th:fragment="header">

    <nav>

        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/products}">
            Products
        </a>

        <a
                th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                th:href="@{/users}">
            Users
        </a>

        <a
                th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                th:href="@{/admin}">
            Dashboard
        </a>

        <span
                th:if="${#authorization.expression('isAuthenticated()')}">

            <img
                    th:src="${#authentication.principal.images != null
                        and !#strings.isEmpty(#authentication.principal.images)
                        ? #authentication.principal.images
                        : '/images/avata.jpg'}"
                    alt="Avatar"
                    width="50"
                    height="50"
                    style="
                        width:50px;
                        height:50px;
                        border-radius:50%;
                        object-fit:cover;
                        vertical-align:middle;
                    ">

            <strong
                    th:text="${#authentication.principal.fullName}">
                System Administrator
            </strong>

            <span
                    th:text="${#authentication.principal.username}">
                admin
            </span>

            <span
                    th:text="${#authentication.principal.email}">
                admin@gmail.com
            </span>

            <span
                    th:text="${#authentication.principal.role}">
                ADMIN
            </span>

            <form
                    th:action="@{/logout}"
                    method="post"
                    style="display:inline;">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <button type="submit">
                    Đăng xuất
                </button>

            </form>

        </span>

        <span
                th:unless="${#authorization.expression('isAuthenticated()')}">

            <a th:href="@{/login}">
                Đăng nhập
            </a>

        </span>

    </nav>

</header>

</body>

</html>
