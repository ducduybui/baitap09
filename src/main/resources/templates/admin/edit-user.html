<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Sửa User')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card">
        <h1>Sửa User</h1>
        <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Username</label>
            <input type="text" name="username" th:value="${user.username}" required>

            <label>Email</label>
            <input type="email" name="email" th:value="${user.email}" required>

            <label>Họ tên</label>
            <input type="text" name="fullName" th:value="${user.fullName}" required>

            <label>Role</label>
            <select name="roleId" required>
                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.name}"
                        th:selected="${user.role != null and user.role.id == role.id}"></option>
            </select>

            <label class="checkbox">
                <input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}">
                Kích hoạt
            </label>

            <button class="btn" type="submit">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/users}">Hủy</a>
        </form>
    </div>
</main>
</body>
</html>
