<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Sản phẩm')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-page">
    <div class="card">
        <h1 th:text="${mode == 'create' ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">Sản phẩm</h1>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}"
              th:object="${productDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Tên sản phẩm</label>
            <input type="text" th:field="*{name}" required>
            <small class="field-error" th:errors="*{name}"></small>

            <label>Mô tả</label>
            <textarea th:field="*{description}" rows="5"></textarea>

            <label>Giá</label>
            <input type="number" step="0.01" min="0" th:field="*{price}" required>
            <small class="field-error" th:errors="*{price}"></small>

            <label>Ảnh</label>
            <input type="file" name="image" accept="image/*">

            <button class="btn" type="submit">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/products}">Hủy</a>
        </form>
    </div>
</main>
</body>
</html>
